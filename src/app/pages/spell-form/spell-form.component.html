<section class="form-page">
  <div
  class="panel"
  [class.flash-ready]="didInit"
  [class.flash]="!!flashSchool"
  [attr.data-school]="flashSchool || school"
  (animationend)="onFlashEnd()">
    <h2 class="title">Create New Spell</h2>

    <!-- Basic fields -->
    <div class="form-grid">
      <label class="field">
        <span class="field__label">Type</span>
        <select class="field__input" [(ngModel)]="type" name="type">
          <option>Standard</option>
          <option>Multiplier</option>
          <option>Percent Buff</option>
        </select>
      </label>

      <label class="field">
        <span class="field__label">Name</span>
        <input class="field__input" [(ngModel)]="name" name="name" />
      </label>

      <label class="field">
        <span class="field__label">School</span>
        <select
          class="field__input school-select"
          [class.flash-ready]="didInit"
          [(ngModel)]="school"
          name="school"
          [attr.data-school]="school">
          <option *ngFor="let s of SCHOOLS">{{ s }}</option>
        </select>
      </label>


      <label class="check mt-8">
        <input class="check__input" type="checkbox" [(ngModel)]="multiTarget" name="mt" />
        <span class="check__label">Multi-target</span>
      </label>
    </div>

    <!-- Standard spell fields -->
    <div *ngIf="type === 'Standard'" class="grid grid-3">
      <label class="field">
        <span class="field__label">Cost</span>
        <input class="field__input" type="number" [(ngModel)]="cost" name="cost" />
      </label>
      <label class="field">
        <span class="field__label">Min</span>
        <input class="field__input" type="number" [(ngModel)]="minDam" name="min" />
      </label>
      <label class="field">
        <span class="field__label">Max</span>
        <input class="field__input" type="number" [(ngModel)]="maxDam" name="max" />
      </label>
    </div>

    <!-- Multiplier spell fields -->
    <div *ngIf="type === 'Multiplier'" class="grid">
      <label class="field">
        <span class="field__label">Damage per Pip</span>
        <input class="field__input" type="number" [(ngModel)]="multiplier" name="mult" />
      </label>
    </div>

    <!-- Percent Buff spell fields -->
    <div *ngIf="type === 'Percent Buff'" class="grid grid-2">
      <label class="field">
        <span class="field__label">Cost</span>
        <input class="field__input" type="number" [(ngModel)]="cost" name="pcost" />
      </label>
      <label class="field">
        <span class="field__label">Damage increase (%)</span>
        <input class="field__input" type="number" [(ngModel)]="percent" name="percent" />
      </label>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-primary btn-block" (click)="save()">Save</button>
    </div>
  </div>
</section>
